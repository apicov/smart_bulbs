# /etc/mosquitto/mosquitto.conf — Pico Bulbs broker
# Two TLS listeners: raw MQTT for the bulbs, WebSockets for the app/browser.

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Keep retained bulb state/status across broker restarts
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300

log_dest stderr
log_type error
log_type warning
log_type notice
connection_messages true

# Bulbs (ESP32): mqtts://<host>:8883
listener 8883
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem

# App (browser / Capacitor WebView): wss://<host>:8084
listener 8084
protocol websockets
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
